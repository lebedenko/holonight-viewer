version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
tasks:
  run:
    desc: Build and launch the selected preset with CLI arguments
    cmds:
    - task: build
      vars:
        PRESET: '{{.PRESET}}'
    - build/{{.PRESET}}/apps/viewer/hn-viewer {{.CLI_ARGS}}
  screenshot:
    desc: Launch Viewer, capture its window after an optional delay, then close it
    cmds:
    - python3 scripts/screenshot.py {{.CLI_ARGS}}
  stage:
    desc: Stage the Release payload without modifying the host
    requires:
      vars:
      - DESTDIR
    cmds:
    - task: build
      vars:
        PRESET: release
    - DESTDIR="{{.DESTDIR}}" cmake --install build/release
  qml-import-check:
    desc: Enforce runtime Controls imports
    cmds:
    - python3 scripts/check-qml-import-policy.py
  qmltypes-check:
    desc: Verify generated application QML type metadata
    deps:
    - build
    cmds:
    - bash scripts/check-qmltypes.sh build/{{.PRESET}}
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  license-check:
    desc: Check license metadata with REUSE
    cmds:
    - reuse lint
  install-check:
    desc: Stage Release and verify installed payload and desktop launch
    cmds:
    - task: build
      vars:
        PRESET: release
    - bash scripts/check-install.sh
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  clean:
    desc: Remove Viewer build directories while preserving local providers and evidence
    cmds:
    - rm -rf -- build/dev build/release build/dev build/sanitizer build/system-install
  visual-check:
    desc: Capture dark/light renders at normal and fractional scale for inspection
    cmds:
    - task: build
      vars:
        PRESET: dev
    - bash scripts/check-visual.sh
  runtime-context:
    desc: Prepare installed payloads for the isolated container check after deps/build/dev
    cmds:
    - bash scripts/prepare-runtime-check.sh
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  sanitizer-check:
    desc: Run native ASan/UBSan regressions against installed providers
    cmds:
    - cmake --preset dev -B build/sanitizer -DVIEWER_ENABLE_SANITIZERS=ON
    - cmake --build build/sanitizer
    - ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir
      build/sanitizer --output-on-failure --no-tests=error

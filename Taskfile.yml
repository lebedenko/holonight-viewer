version: '3'
vars:
  PRESET: '{{default "debug" .PRESET}}'
  HOLONIGHT_DEPENDENCY_PREFIX: '{{default (printf "%s/build/deps/prefix" .TASKFILE_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  HOLONIGHT_QML_IMPORT_PATH: '{{default (printf "%s/lib/qt6/qml" .HOLONIGHT_DEPENDENCY_PREFIX) .HOLONIGHT_QML_IMPORT_PATH}}'
tasks:
  ci:
    desc: Rehearse every push validation lane in fresh pinned containers
    cmds:
    - python3 scripts/ci/run.py
  deps:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps --preset {{.PRESET}}
  configure:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset {{.PRESET}}
  build:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset {{.PRESET}}
  run:
    desc: Build and launch the selected preset with CLI arguments
    cmds:
    - task: build
      vars:
        PRESET: '{{.PRESET}}'
    # Task preserves inherited environment variables over task-level defaults.
    - env QML_IMPORT_PATH="{{.HOLONIGHT_QML_IMPORT_PATH}}" LD_LIBRARY_PATH="{{.HOLONIGHT_DEPENDENCY_PREFIX}}/lib" build/{{.PRESET}}/apps/viewer/hn-viewer {{.CLI_ARGS}}
  screenshot:
    desc: Launch Viewer, capture its window after an optional delay, then close it
    cmds:
    - python3 scripts/screenshot.py {{.CLI_ARGS}}
  stage:
    desc: Stage the Release payload without modifying the host
    requires:
      vars:
      - DESTDIR
    cmds:
    - task: build
      vars:
        PRESET: release
    - DESTDIR="{{.DESTDIR}}" cmake --install build/release
  qml-import-check:
    desc: Enforce runtime Controls imports
    cmds:
    - python3 scripts/check-qml-import-policy.py
  qmltypes-check:
    desc: Verify generated application QML type metadata
    deps:
    - build
    cmds:
    - bash scripts/check-qmltypes.sh build/{{.PRESET}}
  test:
    desc: test using standalone tooling
    cmds:
    - python3 tooling/workflow.py test --preset {{.PRESET}}
  sanitizer-check:
    desc: Build Viewer with ASan/UBSan and run CTest (providers remain uninstrumented)
    cmds:
    - task: build
      vars:
        PRESET: sanitizer
    - ctest --preset sanitizer
  format:
    desc: Format C++ and QML sources
    cmds:
    - python3 scripts/format-sources.py
  format-check:
    desc: Check C++ and QML formatting
    cmds:
    - python3 scripts/format-sources.py --check
  tidy:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope all
  qml-lint:
    desc: Run QML lint checks
    deps:
    - build
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  lint:
    desc: Run C++ and QML lint checks
    cmds:
    - task: tidy
    - task: qml-lint
  license-check:
    desc: Check license metadata with REUSE
    cmds:
    - reuse lint
  install-check:
    desc: Stage Release and verify installed payload and desktop launch
    cmds:
    - task: build
      vars:
        PRESET: release
    - bash scripts/check-install.sh
  check:
    desc: Sequentially build, test, check formatting, lint, licenses, staged installation and QML contracts
    aliases:
    - verify
    cmds:
    - task: build
      vars:
        PRESET: debug
    - task: build
      vars:
        PRESET: release
    - task: test
    - task: format-check
    - task: lint
      vars:
        PRESET: debug
    - task: license-check
    - task: install-check
    - task: qml-import-check
    - task: qmltypes-check
  clean:
    desc: Remove Viewer build directories while preserving local providers and evidence
    cmds:
    - rm -rf -- build/debug build/release build/test build/sanitizer build/system-install
  visual-check:
    desc: Capture dark/light renders at normal and fractional scale for inspection
    cmds:
    - task: build
      vars:
        PRESET: test
    - bash scripts/check-visual.sh
  runtime-context:
    desc: Prepare installed payloads for the isolated container check after deps/build/test
    cmds:
    - bash scripts/prepare-runtime-check.sh
  tooling:doctor:
    desc: doctor using standalone tooling
    cmds:
    - python3 tooling/workflow.py doctor
  tooling:refresh:
    desc: refresh using standalone tooling
    cmds:
    - python3 tooling/workflow.py refresh --preset {{default "test" .EDITOR_PRESET}}
  serena:serve:
    desc: Start independent Serena server in codex context
    cmds:
    - serena start-mcp-server --project "{{.TASKFILE_DIR}}" --context codex
  serena:index:
    desc: Explicitly index this module
    cmds:
    - serena project index "{{.TASKFILE_DIR}}"
  configure-tests:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset test
  configure:release:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset release
  build:release:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset release
  tidy-src:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope src
  tidy-tests:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope tests
  tooling:qmlls:
    desc: Start configured Qt language server with resolved import paths
    cmds:
    - python3 tooling/workflow.py qmlls

name: Build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: viewer
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 03fa635cedc506e101a148fc54f7eb46d17c6de5
          path: holonight-config
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 61d0c16af689e960367fd0f631f2c88afa169441
          path: holonight-qt
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-images
          ref: ac11f23e9ff2d70b1c142b643bc2abb6dd69f6c1
          path: holonight-images
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-thumbnails
          ref: d27addc044f277686850588147ec825c40c0f252
          path: holonight-thumbnails
      - name: Build CI image locally
        run: docker build -t viewer-ci -f viewer/packaging/Dockerfile.ci viewer
      - name: Build and verify
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/work" viewer-ci
          bash -euc 'task deps; task check;
          bash scripts/prepare-runtime-check.sh'

      - name: Isolated installed runtime (no workspace mount)
        run: |
          context=$(cat viewer/build/runtime-check-context)
          context="viewer/build/$(basename "$context")"
          docker build -t viewer-runtime-check "$context"
          docker run --rm --network none viewer-runtime-check

name: Build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: viewer
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: fe69a59e6b73167fd5349223a4d265d75386c139
          path: holonight-config
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 22ded7815727ce483fd91e82a9cc04bfe252ec3b
          path: holonight-qt
      - name: Build CI image locally
        run: docker build -t viewer-ci -f viewer/packaging/Dockerfile.ci viewer
      - name: Build and verify
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" viewer-ci
          bash -euc 'task deps; task build; task build PRESET=release;
          task test; task format-check; task tidy; task qml-lint;
          task install-check; task desktop-check'

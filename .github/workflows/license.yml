name: Licensing
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire pinned REUSE image
        run: python3 -c 'import json, subprocess; subprocess.run(["docker", "pull", "--platform", "linux/amd64", json.load(open("scripts/ci/images.json"))["licensing"]], check=True)'
      - run: python3 scripts/ci/run.py --lane licensing
